<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cd5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mera Khata</title>
<script src="config.js"></script>
<style>
:root{
  --pri:#0b5cd5; --pri2:#0a47a8; --bg:#eef2f8; --card:#fff; --ink:#1b2333; --mut:#6b7486; --soft:#f2f4f8; --prisoft:#e8effc;
  --green:#12a150; --greenbg:#e5f6ec; --red:#e0393e; --redbg:#fdeaea; --line:#e3e8f0; --amber:#e8a200; --amberbg:#fff5dc;
}
body.dark{--bg:#0f1420;--card:#192030;--ink:#e8ecf4;--mut:#93a0b6;--soft:#232c3f;--prisoft:#1f2d4a;--line:#2a344a;--greenbg:#143326;--redbg:#3a1a1d;--amberbg:#3a2f12;--pri:#3d82f0;--pri2:#2c5fc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htop h1{font-size:19px;margin:0;flex:1}
.iconbtn{background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.cloud{font-size:11px;background:rgba(255,255,255,.16);padding:5px 9px;border-radius:20px;white-space:nowrap}
.month{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.month b{min-width:130px;text-align:center;font-size:16px}
.month{flex-wrap:wrap}.month small{display:block;width:100%;text-align:center;font-size:11px;opacity:.85;margin-top:-6px}
.langbtn{background:rgba(255,255,255,.16);color:#fff;padding:8px 10px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap}
.langmenu{position:fixed;top:56px;right:max(12px,calc(50% - 268px));background:var(--card);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:45;overflow:hidden;min-width:170px}
.langmenu button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;padding:13px 16px;font-size:15px;color:var(--ink);text-align:left;border-bottom:1px solid var(--line)}
.langmenu button:last-child{border-bottom:0}.langmenu button.on{color:var(--pri);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:600}
.cal .d{background:var(--soft);border-radius:9px;min-height:58px;padding:4px 3px;font-size:10px;text-align:center;display:flex;flex-direction:column;gap:1px}
.cal .d b{font-size:12px;color:var(--ink)}.cal .d.today{outline:2px solid var(--pri)}.cal .d.x{background:none}
.cal .d .o{color:var(--red);font-weight:600}.cal .d .i{color:var(--green);font-weight:600}
.qk{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qk button{flex:none;background:var(--soft);color:var(--ink);padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600}
.toast button{background:#fff;color:#1b2333;border-radius:8px;padding:4px 10px;margin-left:10px;font-weight:700}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Jameel Noori Nastaleeq",system-ui,sans-serif}
html[dir=rtl] .langmenu{right:auto;left:max(12px,calc(50% - 268px))}
html[dir=rtl] .langmenu button{text-align:right}
html[dir=rtl] .drw{left:auto;right:0;transform:translateX(100%)}html[dir=rtl] .drw.show{transform:none}
html[dir=rtl] .fab{right:auto;left:max(16px,calc(50% - 264px))}
html[dir=rtl] .drw-list button.on{border-right:0;border-left:4px solid var(--pri)}
main{padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,80,.06)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:14px;padding:12px}
.stat small{display:block;font-size:12px;opacity:.85}
.stat b{font-size:19px;display:block;margin-top:3px}
.s-in{background:var(--greenbg);color:var(--green)}
.s-out{background:var(--redbg);color:var(--red)}
.s-bal{background:var(--prisoft);color:var(--pri)}
.s-mut{background:var(--soft);color:var(--ink)}
.s-amb{background:var(--amberbg);color:var(--amber)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;background:var(--prisoft);color:var(--pri);font-size:17px}
.grow{flex:1;min-width:0}
.grow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .s{font-size:12px;color:var(--mut);margin-top:2px}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.g{color:var(--green)}.r{color:var(--red)}.m{color:var(--mut)}.a{color:var(--amber)}
.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--mut);font-weight:600;white-space:nowrap}
.pill.g{background:var(--greenbg)}.pill.r{background:var(--redbg)}
.btn{background:var(--pri);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600}
.btn.full{width:100%;margin-top:14px}
.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red);color:#fff}
.btn.light{background:var(--prisoft);color:var(--pri)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;padding:8px 2px 9px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:82px;width:58px;height:58px;border-radius:18px;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 16px rgba(11,92,213,.4);z-index:6}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;background:none;padding:9px 4px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);color:var(--ink);padding:8px 12px;border-radius:20px;font-size:13px}
.chip.on{background:var(--pri);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.x{background:var(--soft);width:34px;height:34px;border-radius:10px;font-size:16px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:15px}
.chk.on{background:var(--green);border-color:var(--green)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.months button{background:var(--soft);padding:8px 2px;border-radius:9px;font-size:12px;color:var(--ink)}
.months button.on{background:var(--green);color:#fff}
.months button.me{outline:2px solid var(--amber)}
.lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--pri),var(--pri2));z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px}
.lock input{max-width:260px;margin-top:12px;color:#1b2333;background:#fff}
.lock .pin{text-align:center;font-size:24px;letter-spacing:8px;max-width:220px}
.search{margin-bottom:12px}
.big{font-size:26px;font-weight:800}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.mic{width:48px;height:48px;border-radius:14px;background:var(--prisoft);color:var(--pri);font-size:22px;flex:none}
.mic.on{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.alert{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--amberbg);margin-bottom:8px;font-size:14px}
.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--card);border-radius:14px;padding:14px 10px;text-align:left;box-shadow:0 1px 3px rgba(20,40,80,.06);font-weight:600;font-size:14px}
.menu button span{display:block;font-size:22px;margin-bottom:4px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.tg{width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}.tg.on::after{left:23px}
.drw-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:40;opacity:0;transition:.2s}
.drw-bg.show{opacity:1}
.drw{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:310px;background:var(--card);z-index:41;transform:translateX(-100%);transition:.22s ease;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.2)}
.drw.show{transform:none}
.drw-top{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:22px 18px 18px}
.drw-top .av{background:rgba(255,255,255,.2);color:#fff;width:52px;height:52px;font-size:24px;border-radius:16px;margin-bottom:10px}
.drw-list{flex:1;overflow:auto;padding:8px 0}
.drw-list button{display:flex;align-items:center;gap:14px;width:100%;background:none;padding:12px 20px;font-size:15px;text-align:left;color:var(--ink)}
.drw-list button span{width:24px;text-align:center;font-size:19px}
.drw-list button.on{background:var(--prisoft);color:var(--pri);font-weight:700;border-right:4px solid var(--pri)}
.drw-sec{font-size:11px;color:var(--mut);padding:12px 20px 4px;text-transform:uppercase;letter-spacing:.6px}
.drw-out{border-top:1px solid var(--line);padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.drw-out button{width:100%;background:var(--redbg);color:var(--red);padding:13px;border-radius:12px;font-weight:700;font-size:15px}
@media print{header,nav,.fab,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.app{padding:0}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="htop">
      <button class="iconbtn" onclick="openDrawer()" title="Menu">☰</button>
      <h1 id="htitle">Mera Khata</h1>
      <span class="cloud" id="cloudSt" style="display:none"></span>
      <button class="langbtn" id="langBtn" onclick="langMenu()">🌐 <span id="langLbl">Language</span> ▾</button>
    </div>
    <div class="month" id="monthBar">
      <button class="iconbtn" onclick="shiftMonth(-1)">‹</button>
      <b id="monthLbl"></b><small id="periodLbl" style="display:none"></small>
      <button class="iconbtn" onclick="shiftMonth(1)">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" onclick="fabClick()">+</button>
<nav><div class="in">
  <button data-t="home" onclick="go('home')"><span>🏠</span>Home</button>
  <button data-t="hisaab" onclick="go('hisaab')"><span>📒</span>Hisaab</button>
  <button data-t="udhaar" onclick="go('udhaar')"><span>🤝</span>Udhaar</button>
  <button data-t="committee" onclick="go('committee')"><span>👥</span>Committee</button>
  <button data-t="bills" onclick="go('bills')"><span>🧾</span>Bills</button>
</div></nav>
<div id="modal"></div>

<script>
/* ================= DATA ================= */
const KEY='mera_khata_v1';
const DEF_CATS={
  in:['Salary','Business','Committee Mili','Gift','Kiraya Aamdani','Doosri Aamdani'],
  out:['Ration','Bijli','Pani','Gas','Internet/Mobile','Kiraya','School Fees','Petrol','Dawai','Committee Qist','Bahar Khana','Kapre','Zakat/Sadqa','Qarz Qist','Miscellaneous']
};
const CAT_ICON={Salary:'💼',Business:'🏪','Committee Mili':'🎉',Gift:'🎁','Kiraya Aamdani':'🏠','Doosri Aamdani':'➕',
 Ration:'🛒',Bijli:'💡',Pani:'🚰',Gas:'🔥','Credit Card Bill':'💳','Internet/Mobile':'📶',Kiraya:'🏠','School Fees':'🎓',Petrol:'⛽',Dawai:'💊','Committee Qist':'👥','Bahar Khana':'🍔',Kapre:'👕','Zakat/Sadqa':'🤲','Qarz Qist':'🏦',Miscellaneous:'📦',Transfer:'🔁'};
const ACC_ICON={cash:'💵',bank:'🏦',wallet:'📱',card:'💳'};
// voice words -> category
const VOICE_CAT={Ration:['ration','rashan','sauda','grocery','doodh','milk','sabzi','atta','آٹا','راشن','دودھ','سبزی'],Bijli:['bijli','electric','light','k-electric','بجلی'],Pani:['pani','water','پانی'],Gas:['gas','sui gas','گیس'],
 'Internet/Mobile':['internet','mobile','load','balance','wifi','انٹرنیٹ'],Kiraya:['kiraya','rent','کرایہ'],'School Fees':['school','fees','fee','tuition','اسکول','فیس'],Petrol:['petrol','fuel','diesel','پٹرول'],Dawai:['dawai','medicine','doctor','dawa','دوائی','ڈاکٹر'],
 'Bahar Khana':['khana','hotel','restaurant','food','pizza','کھانا'],Kapre:['kapre','kapde','clothes','کپڑے'],Salary:['salary','tankhwah','tankha','تنخواہ'],Business:['business','karobar','کاروبار'],Gift:['gift','tohfa','تحفہ'],'Zakat/Sadqa':['zakat','sadqa','khairat','زکوٰۃ','صدقہ']};

function blank(){return{v:2,tx:[],people:[],led:[],committees:[],bills:[
  {id:uid(),name:'Bijli ka bill',cat:'Bijli',amount:0,due:10},
  {id:uid(),name:'Gas ka bill',cat:'Gas',amount:0,due:10},
  {id:uid(),name:'Pani ka bill',cat:'Pani',amount:0,due:10},
  {id:uid(),name:'Credit Card bill',cat:'Credit Card Bill',amount:0,due:20,card:'card'}
 ],billPaid:{},quick:[],subcats:{Ration:['Doodh','Sabzi','Atta/Chawal','Gosht','Phal']},assets:[],loans:[],cats:JSON.parse(JSON.stringify(DEF_CATS)),accs:defAccs(),budgets:{},goals:[],recur:[],recurDone:{},zakat:{},set:{pin:'1234',pinInit:true,name:'Mera Khata',dark:false,notif:false}}}
function defAccs(){return[{id:'cash',name:'Cash (jeb)',type:'cash',open:0},{id:'bank',name:'Bank',type:'bank',open:0},{id:'wallet',name:'JazzCash / Easypaisa',type:'wallet',open:0},{id:'card',name:'Credit Card',type:'card',open:0,limit:0}]}
function migrate(d){
  d.cats=d.cats||JSON.parse(JSON.stringify(DEF_CATS));d.set=d.set||{};if(!d.set.pinInit){if(!d.set.pin)d.set.pin='1234';d.set.pinInit=true}d.billPaid=d.billPaid||{};
  d.accs=d.accs||defAccs();d.quick=d.quick||[];d.subcats=d.subcats||{};d.assets=d.assets||[];d.loans=d.loans||[];if(!d.cats.out.includes('Qarz Qist'))d.cats.out.push('Qarz Qist');d.budgets=d.budgets||{};d.goals=d.goals||[];d.recur=d.recur||[];d.recurDone=d.recurDone||{};d.zakat=d.zakat||{};
  d.tx.forEach(t=>{if(t.type!=='tr'&&t.acc===undefined)t.acc='cash'});
  d.bills.forEach(b=>{if(b.cat==='Credit Card Bill'&&!b.card){const c=d.accs.find(a=>a.type==='card');if(c)b.card=c.id}});
  d.v=2;return d}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tx)return migrate(d)}catch(e){}return blank()}
let D=load();
function save(skipCloud){try{D.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Save nahi hua! Phone ki memory check karein')}if(!skipCloud)cloudPush()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ================= HELPERS ================= */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let hView='list', cur=curPeriod(), tab='home', hisaabType='all', hisaabCat='', hisaabQ='', udSearch='';
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDiff(s){const a=new Date(s+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/864e5)}
function mLabel(m){const[y,mm]=m.split('-');return MN[+mm-1]+' '+y}
function addM(m,n){let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')}
function lastDay(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()}
function mDate(m,d){return m+'-'+String(Math.min(Math.max(1,d||1),lastDay(m))).padStart(2,'0')}
function rs(n){n=Math.round(+n||0);return 'Rs '+Math.abs(n).toLocaleString('en-PK')}
function srs(n){return (n<0?'− ':'')+rs(n)}
function fd(s){if(!s)return'';const[y,m,d]=s.split('-');return (+d)+' '+MN[+m-1]+' '+y}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(id){return document.getElementById(id)}
function toast(t,ms){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||1900)}
function mS(){return Math.min(28,Math.max(1,+(D&&D.set&&D.set.mStart)||1))}
function pRange(m){const S=mS();if(S===1)return[m+'-01',m+'-'+String(lastDay(m)).padStart(2,'0')];const n=addM(m,1);return[mDate(m,S),mDate(n,S-1)]}
function periodOf(d){const m=d.slice(0,7);return +d.slice(8)>=mS()?m:addM(m,-1)}
function curPeriod(){return periodOf(today())}
function monthTx(m){const[a,b]=pRange(m);return D.tx.filter(t=>t.date>=a&&t.date<=b)}
function sum(a,f){return a.reduce((s,x)=>s+(+f(x)||0),0)}
function pBal(pid){return sum(D.led.filter(l=>l.pid===pid),l=>l.kind==='gave'?l.amount:-l.amount)}
function accName(id){const a=D.accs.find(x=>x.id===id);return a?a.name:''}
function accBal(id){const a=D.accs.find(x=>x.id===id);if(!a)return 0;let b=+a.open||0;
  D.tx.forEach(t=>{const v=+t.amount||0;if(t.type==='in'&&t.acc===id)b+=v;else if(t.type==='out'&&t.acc===id)b-=v;else if(t.type==='tr'){if(t.from===id)b-=v;if(t.to===id)b+=v}});
  D.led.forEach(l=>{if(l.acc===id)b+=l.kind==='gave'?-l.amount:+l.amount});
  return b}
function accOpts(sel,noneLabel){return (noneLabel?`<option value="" ${!sel?'selected':''}>${noneLabel}</option>`:'')+D.accs.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${ACC_ICON[a.type]||''} ${esc(a.name)}</option>`).join('')}
function shiftMonth(n){cur=addM(cur,n);render()}
function catSpent(m,c){return sum(monthTx(m).filter(t=>t.type==='out'&&t.cat===c),t=>t.amount)}

function go(t){if(t!==tab)stack.push(tab);tab=t;window.scrollTo(0,0);render()}

}

/* ================= REMINDERS ================= */
function reminders(){
  const out=[], m=ym(new Date()), paid=D.billPaid[m]||{};
  D.bills.forEach(b=>{if(paid[b.id]||!b.due)return;const dd=dayDiff(mDate(m,b.due));if(dd<=3)out.push({ic:'🧾',t:`${b.name}: ${dd<0?(-dd)+' din guzar gaye!':dd===0?'aaj akhri din':dd+' din baqi'}`,k:dd<0?'r':'a'})});
  D.people.forEach(p=>{const bal=pBal(p.id);if(!bal)return;
    const dues=D.led.filter(l=>l.pid===p.id&&l.due).map(l=>l.due).sort();if(!dues.length)return;const due=dues[dues.length-1];const dd=dayDiff(due);
    if(dd<=3)out.push({ic:'🤝',t:`${p.name}: ${rs(bal)} ${bal>0?'lene':'dene'} — ${dd<0?(-dd)+' din se baqi':dd===0?'aaj wapsi':dd+' din mein wapsi'}`,k:dd<0?'r':'a',pid:p.id})});
  D.committees.forEach(c=>{if(cActive(c,m)&&!(c.paid||{})[m])out.push({ic:'👥',t:`${c.name}: is mahine ki qist ${rs(c.amount)} baqi`,k:'a'})});
  D.loans.forEach(l=>{if(lActive(l,m)&&!(l.paid||{})[m])out.push({ic:'🏦',t:`${l.name}: is mahine ki qist ${rs(l.inst)} baqi`,k:'a'})});
  return out}
function notifyOnce(){
  if(!D.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const k='khata_notif_day';if(localStorage.getItem(k)===today())return;
  const r=reminders();if(!r.length)return;localStorage.setItem(k,today());
  try{navigator.serviceWorker.ready.then(sw=>sw.showNotification('Mera Khata — yaad-dihani',{body:r.map(x=>x.t).join('\n'),icon:'icon-192.png'}))}catch(e){}
}

    ${(D.quick||[]).length?'':'<div class="hint">Roz wali cheezein (doodh, petrol, load) ek tap mein likhne ke liye button banayein.</div>'}
  </div>

  <div class="card" onclick="go('accounts')">
    <h3>💰 Mere paise <span class="pill">accounts ›</span></h3>
    <div class="grid2">
      <div class="stat s-bal"><small>Haath mein (cash + bank + wallet)</small><b>${srs(cash)}</b></div>
      ${cards.length?`<div class="stat s-out"><small>💳 Credit card baqaya</small><b>${rs(Math.max(0,cardDue))}</b></div>`:''}

function budRow([c,l,s]){const p=s/l*100,col=p>=100?'var(--red)':p>=80?'var(--amber)':'var(--green)';
  return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${CAT_ICON[c]||'•'} ${esc(c)}</span><span><b style="color:${col}">${rs(s)}</b> <span class="m">/ ${rs(l)}</span></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div>${p>=100?`<div class="hint r">⚠️ Budget se ${rs(s-l)} zyada</div>`:''}</div>`}
function sortTx(a,b){return b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)}
function txList(a){return a.map(t=>{
  if(t.type==='tr')return `<div class="row" onclick="trForm('${t.id}')"><div class="av">🔁</div><div class="grow"><div class="t">${esc(accName(t.from))} → ${esc(accName(t.to))}</div><div class="s">${fd(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="amt m">${rs(t.amount)}</div></div>`;
  return `<div class="row" onclick="txForm(null,'${t.id}')"><div class="av" style="background:${t.type==='in'?'var(--greenbg)':'var(--redbg)'}">${CAT_ICON[t.cat]||(t.type==='in'?'⬇':'⬆')}</div><div class="grow"><div class="t">${esc(t.cat)}${t.sub?' › '+esc(t.sub):''}${t.photo?' 📷':''}${t.rid?' 🔄':''}${t.grp?' ✂️':''}</div><div class="s">${fd(t.date)}${t.acc?' · '+(ACC_ICON[(D.accs.find(a=>a.id===t.acc)||{}).type]||''):''}${t.note?' · '+esc(t.note):''}</div></div><div class="amt ${t.type==='in'?'g':'r'}">${t.type==='in'?'+':'−'} ${rs(t.amount)}</div></div>`}).join('')}

/* ================= HISAAB ================= */
function vHisaab(v){
  if(hView==='cal'&&!hisaabQ.trim())return vCal(v);
  const q=hisaabQ.trim().toLowerCase();
  let tx=q?D.tx.filter(t=>(t.cat+' '+(t.sub||'')+' '+(t.note||'')+' '+t.amount+' '+accName(t.acc)).toLowerCase().includes(q)).sort(sortTx):monthTx(cur).sort(sortTx);
  if(hisaabType!=='all')tx=tx.filter(t=>t.type===hisaabType);
  if(hisaabCat)tx=tx.filter(t=>t.cat===hisaabCat);
  const base=q?D.tx:monthTx(cur);
  const cats=[...new Set(base.filter(t=>t.type!=='tr'&&(hisaabType==='all'||t.type===hisaabType)).map(t=>t.cat))];
  const total=sum(tx,t=>t.type==='in'?t.amount:t.type==='out'?-t.amount:0);
  const groups={};tx.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  v.innerHTML=`
  <div class="seg"><button class="on">📋 List</button><button onclick="hView='cal';render()">📅 Calendar</button></div>
  <input class="search" id="hq" placeholder="🔍 Sab mahino mein dhoondein (naam, note, raqam)" value="${esc(hisaabQ)}">
  <div class="seg">
    <button class="${hisaabType==='all'?'on':''}" onclick="hisaabType='all';hisaabCat='';render()">Sab</button>
    <button class="${hisaabType==='in'?'on':''}" onclick="hisaabType='in';hisaabCat='';render()">Aamdani</button>
    <button class="${hisaabType==='out'?'on':''}" onclick="hisaabType='out';hisaabCat='';render()">Kharcha</button>
    <button class="${hisaabType==='tr'?'on':''}" onclick="hisaabType='tr';hisaabCat='';render()">Transfer</button>
  </div>
  ${cats.length>1?`<div class="chips" style="margin-bottom:12px" id="hcats"><button class="chip ${!hisaabCat?'on':''}" data-c="">Sab</button>${cats.map(c=>`<button class="chip ${hisaabCat===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
  <div class="card"><div style="display:flex;justify-content:space-between"><span class="m">${q?'Talash: ':''}${tx.length} entries</span><b class="${total>=0?'g':'r'}">${srs(total)}</b></div></div>
  ${Object.keys(groups).length?Object.entries(groups).map(([d,a])=>`<div class="card"><h3>${fd(d)} <span class="pill">${srs(sum(a,t=>t.type==='in'?t.amount:t.type==='out'?-t.amount:0))}</span></h3>${txList(a)}</div>`).join(''):`<div class="card empty">${q?'Kuch nahi mila.':'Is mahine koi entry nahi.<br>Neeche <b>+</b> dabayein.'}</div>`}`;
  let tm;$('hq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{hisaabQ=e.target.value;render();const s=$('hq');s.focus();s.setSelectionRange(999,999)},350)};
  if($('hcats'))$('hcats').onclick=e=>{const b=e.target.closest('button');if(b){hisaabCat=b.dataset.c;render()}};
}

let recog=null;
function listen(cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert('Is browser mein awaz se likhna nahi chalta. Chrome istemal karein.');
  const btn=$('fMic');
  if(recog){recog.stop();return}
  recog=new SR();recog.lang=D.set.vlang||'en-IN';recog.interimResults=false;recog.maxAlternatives=1;
  btn&&btn.classList.add('on');
  recog.onresult=e=>cb(e.results[0][0].transcript);
  recog.onerror=e=>{toast(e.error==='not-allowed'?'Mic ki ijazat dein':'Awaz samajh nahi aayi, dobara bolein')};
  recog.onend=()=>{recog=null;btn&&btn.classList.remove('on')};
  recog.start();toast('Bolein: maslan "Ration 4500"');
}
function parseVoice(txt){
  let s=' '+txt.toLowerCase().replace(/,/g,'')+' ';
  // numbers in Urdu digits -> latin
  s=s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const W={ek:1,aik:1,one:1,do:2,two:2,teen:3,three:3,char:4,chaar:4,four:4,panch:5,paanch:5,five:5,chhe:6,che:6,six:6,saat:7,seven:7,aath:8,eight:8,nau:9,nine:9,das:10,ten:10,bees:20,twenty:20,pachas:50,pachaas:50,fifty:50,dedh:1.5,dhai:2.5,dhaai:2.5};
  const M={hazar:1e3,hazaar:1e3,hajar:1e3,thousand:1e3,'ہزار':1e3,lakh:1e5,lac:1e5,'لاکھ':1e5,sau:100,so:100,hundred:100,'سو':100};
  const toks=s.trim().split(/\s+/);let total=0,curN=0,found=false;
  for(const tk of toks){
    const n=parseFloat(tk);
    if(!isNaN(n)&&/^\d/.test(tk)){curN+=n;found=true}
    else if(W[tk]!==undefined){curN+=W[tk];found=true}
    else if(M[tk]){if(!curN)curN=1;if(M[tk]>=1000){total+=curN*M[tk];curN=0}else curN*=M[tk];found=true}
    else if(tk==='rupay'||tk==='rupees'||tk==='rs'||tk==='rupaye'||tk==='روپے'){}
  }
  const amount=found?Math.round(total+curN):0;
  let cat='';const all=[...D.cats.out,...D.cats.in];
  for(const c of all)if(s.includes(c.toLowerCase())){cat=c;break}
  if(!cat)for(const[c,ws]of Object.entries(VOICE_CAT)){if(all.includes(c)&&ws.some(w=>s.includes(w))){cat=c;break}}
  const note=txt.split(/\s+/).filter(w=>{const l=w.toLowerCase().replace(/,/g,'');return !/^[\d.]+$/.test(l)&&W[l]===undefined&&!M[l]&&!['rupay','rupees','rs','rupaye','روپے'].includes(l)}).join(' ').trim();
  return{amount,cat,note:note.length>2&&note.length<60?note:''}
}

let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('khata_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbSet(k,v){const db=await idb();return new Promise(r=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=r;t.onerror=r})}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('p').objectStore('p').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbDel(k){try{const db=await idb();db.transaction('p','readwrite').objectStore('p').delete(k)}catch(e){}}
function compress(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const mx=1000,sc=Math.min(1,mx/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};img.src=URL.createObjectURL(file)})}

/* ================= RECURRING ================= */
function runRecurring(){
  const now=ym(new Date()), dNow=new Date().getDate();let n=0;
  D.recur.forEach(r=>{if(r.off)return;let m=r.start||now;let guard=0;
    while(m<=now&&guard++<120){
      const k=r.id+'|'+m;
      if(!D.recurDone[k]&&(m<now||dNow>=Math.min(r.day,lastDay(m)))){
        const t={id:uid(),ts:Date.now(),type:r.type,cat:r.cat,amount:r.amount,acc:r.acc,date:mDate(m,r.day),note:r.note||'',rid:r.id};
        D.tx.push(t);D.recurDone[k]=t.id;n++}
      m=addM(m,1)}});
  if(n){save();toast(n+' har-mahine wali entry khud likh di 🔄',2600)}
}

function monthSummary(m){const tx=monthTx(m),inc=sum(tx.filter(t=>t.type==='in'),t=>t.amount),out=sum(tx.filter(t=>t.type==='out'),t=>t.amount);

const CFG=window.KHATA_CFG||{};
let sb=null, user=null, cloud={st:'off',timer:null,dirty:false};
function cloudOn(){return !!(CFG.url&&CFG.key)}
function setCloud(st){cloud.st=st;const e=$('cloudSt');if(!e)return;e.style.display=cloudOn()&&user?'inline':'none';

function cloudCard(){
  if(!cloudOn())return `<div class="card"><h3>☁️ Online backup</h3><div class="m" style="font-size:13px">Abhi band hai — data sirf is phone mein hai. (config.js mein Supabase lagana hai)</div></div>`;
  return `<div class="card"><h3>☁️ Online account <span class="pill ${cloud.st==='ok'?'g':'r'}">${cloud.st==='ok'?'Sab save ✓':cloud.st==='busy'?'Save ho raha…':'Internet nahi'}</span></h3>
  <div class="m" style="font-size:13px">${user?esc(user.email):''}<br>Data online mehfooz hai. Naya phone ho to isi email/password se login karein, sab wapis aa jayega. (Photos sirf isi phone mein rehti hain)</div>
  <div class="btns2" style="margin-top:10px"><button class="btn light" onclick="cloudPush(true)">🔄 Abhi sync</button><button class="btn light" style="color:var(--red)" onclick="logout()">Logout</button></div></div>`}
function cloudPush(now){
  if(!sb||!user)return;cloud.dirty=true;clearTimeout(cloud.timer);
  cloud.timer=setTimeout(async()=>{setCloud('busy');
    const {error}=await sb.from('khata').upsert({user_id:user.id,data:D,updated_at:new Date(D.updated||Date.now()).toISOString()});
    if(error){setCloud('err');console.warn(error)}else{cloud.dirty=false;setCloud('ok')}
    if(tab==='more')render()},now?0:1200)}
async function cloudPull(){
  setCloud('busy');
  const {data,error}=await sb.from('khata').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error){setCloud('err');return}
  if(data&&data.data&&data.data.tx){
    const remoteT=new Date(data.updated_at).getTime(), localT=D.updated||0;
    const localEmpty=!D.tx.length&&!D.people.length&&!D.committees.length;
    if(remoteT>localT||localEmpty){D=migrate(data.data);save(true);setCloud('ok');render();return}
  }
  cloudPush(true)}

function importSample(){const csv='﻿Tareekh,Qisam,Category,Raqam,Account,Note\n2026-11-01,Aamdani,Salary,90000,Bank,Office\n2026-11-02,Kharcha,Ration,4500,Cash (jeb),Imtiaz\n03/11/2026,Kharcha,Bijli,7200,,K-Electric\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='khata-namuna.csv';a.click()}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(y=>String(y).trim()))}
function normDate(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return normDate(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  v=String(v||'').trim();let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return ''}
async function importFile(inp){const f=inp.files[0];inp.value='';if(!f)return;let rows;
  try{if(/\.csv$/i.test(f.name)){rows=parseCSV(await f.text())}else{toast('File parh raha hun…');await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true})}}
  catch(e){return alert('File nahi khul saki. Internet check karein ya CSV mein save kar ke dobara try karein.')}
  if(!rows||rows.length<2)return alert('File mein data nahi mila');
  const h=rows[0].map(x=>String(x||'').toLowerCase().trim());const col=ks=>h.findIndex(x=>ks.some(k=>x.includes(k)));
  const cD=col(['tareekh','date','تاریخ']),cT=col(['qisam','type','قسم']),cC=col(['category','cat','کیٹیگری']),cA=col(['raqam','amount','rs','رقم']),cAc=col(['account','اکاؤنٹ']),cN=col(['note','tafseel','detail','description','نوٹ']);
  if(cD<0||cA<0)return alert('Tareekh aur Raqam ke columns nahi mile. Namuna file dekhein.');
  const out=[];let skip=0;
  rows.slice(1).forEach(r=>{const d=normDate(r[cD]);let a=parseFloat(String(r[cA]??'').replace(/[^\d.\-]/g,''));if(!d||!a){skip++;return}
    let tv=cT>=0?String(r[cT]||'').toLowerCase():'';let type=/aamdani|income|in\b|credit|آمدنی/.test(tv)?'in':/kharcha|expense|out|debit|خرچ/.test(tv)?'out':(a<0?'out':'out');
    a=Math.abs(a);let cat=cC>=0&&String(r[cC]||'').trim()||(type==='in'?'Doosri Aamdani':'Miscellaneous');
    if(!D.cats[type].includes(cat))D.cats[type].push(cat);
    const an=cAc>=0?String(r[cAc]||'').trim().toLowerCase():'';const acc=an?(D.accs.find(x=>x.name.toLowerCase()===an||x.name.toLowerCase().startsWith(an))||{}).id||'':'';
    out.push({id:uid(),ts:Date.now(),type,cat,amount:a,date:d,note:cN>=0?String(r[cN]||'').trim():'',acc,imp:1})});
  if(!out.length)return alert('Koi sahi line nahi mili');
  if(!confirm(out.length+' entries mili hain'+(skip?' ('+skip+' lines chhor di)':'')+'. Hisaab mein daal dein?'))return;
  const _u=snapU();D.tx.push(...out);save();render();toastUndo(out.length+' entries import ho gayi',()=>{D=migrate(JSON.parse(_u));save();render()})}

function vCal(v){

function forecastCard(){
  const[a,b]=pRange(cur),t=today();const daysLeft=Math.max(0,Math.round((new Date(b+'T00:00:00')-new Date(t+'T00:00:00'))/864e5));
  const now=sum(D.accs.filter(x=>x.type!=='card'),x=>accBal(x.id));
  const rows=[];let plus=0,minus=0;
  // recurring not yet done in this period
  D.recur.filter(r=>!r.off).forEach(r=>{let m=r.start||cur;[ym(new Date()),addM(ym(new Date()),1)].forEach(mm=>{const dt=mDate(mm,r.day);if(dt>t&&dt<=b&&mm>=(r.start||mm)&&!D.recurDone[r.id+'|'+mm]){if(r.type==='in'){plus+=r.amount;rows.push(['🔄 '+(r.note||r.cat),r.amount,1])}else{minus+=r.amount;rows.push(['🔄 '+(r.note||r.cat),r.amount,-1])}}})});
  // unpaid bills (calendar month of today)
  const bm=ym(new Date()),paid=D.billPaid[bm]||{};
  D.bills.filter(x=>!paid[x.id]).forEach(x=>{const amt=x.card?Math.max(0,-accBal(x.card)):(+x.amount||0);if(amt){minus+=amt;rows.push(['🧾 '+x.name,amt,-1])}});
  D.committees.filter(c=>cActive(c,bm)&&!(c.paid||{})[bm]).forEach(c=>{minus+=c.amount;rows.push(['👥 '+c.name,c.amount,-1])});
  D.loans.filter(l=>lActive(l,bm)&&!(l.paid||{})[bm]).forEach(l=>{minus+=l.inst;rows.push(['🏦 '+l.name,l.inst,-1])});
  // daily variable spending average (excluding bills/committee/recurring)
  const fixed=new Set(D.bills.map(x=>x.cat).concat(['Committee Qist','Qarz Qist']));
  const varOut=sum(monthTx(cur).filter(x=>x.type==='out'&&!x.rid&&!fixed.has(x.cat)),x=>x.amount);
  const passed=Math.max(1,Math.round((new Date(t+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)+1);
  const daily=varOut/passed, dailyTot=Math.round(daily*daysLeft);if(dailyTot){minus+=dailyTot;rows.push(['🛒 Rozana kharcha (~'+rs(daily)+' × '+daysLeft+' din)',dailyTot,-1])}
  const end=now+plus-minus;
  return `<div class="card"><h3>🔮 Mahine ke akhir tak andaza <span class="pill">${daysLeft} din baqi</span></h3>
  <div class="grid2"><div class="stat s-bal"><small>Abhi haath mein</small><b>${srs(now)}</b></div><div class="stat ${end<0?'s-out':'s-in'}"><small>${fd(b)} tak bachenge</small><b>${srs(end)}</b></div></div>
  ${rows.length?`<div style="margin-top:8px">${rows.map(([l,a,sg])=>`<div class="row" style="padding:7px 0"><div class="grow s" style="font-size:13px;color:var(--ink)">${esc(l)}</div><b class="${sg>0?'g':'r'}" style="font-size:13px">${sg>0?'+':'−'}${rs(a)}</b></div>`).join('')}</div>`:''}
  ${end<0?'<div class="alert" style="margin-top:8px"><span>⚠️</span><span class="r" style="font-weight:600">Is raftar se mahina poora nahi hoga — kharcha kam karein</span></div>':''}</div>`}

let TMAP=null,TRE=null;
if(LANG!=='ru'){TMAP={};DICT.split('\n').forEach(l=>{const p=l.split('|');if(p.length===3)TMAP[p[0]]=LANG==='ur'?p[1]:p[2]});
  const keys=Object.keys(TMAP).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  TRE=new RegExp('(?<![A-Za-z])('+keys.join('|')+')(?![A-Za-z])','g');
  document.documentElement.lang=LANG;if(LANG==='ur')document.documentElement.dir='rtl';
  const _c=window.confirm.bind(window),_a=window.alert.bind(window),_p=window.prompt.bind(window);
  window.confirm=m=>_c(T(m));window.alert=m=>_a(T(m));window.prompt=(m,v)=>_p(T(m),v);
}
function T(s){return TRE&&s?String(s).replace(TRE,m=>TMAP[m]??m):s}
function trNode(root){if(!TRE||!root)return;
  if(root.nodeType===3){const v=root.nodeValue,n=T(v);if(n!==v)root.nodeValue=n;return}
  if(root.nodeType!==1||root.tagName==='SCRIPT'||root.tagName==='STYLE'||root.classList&&root.classList.contains('notr'))return;
  if(root.placeholder){const n=T(root.placeholder);if(n!==root.placeholder)root.placeholder=n}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&(n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.classList.contains('notr'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while(n=w.nextNode()){if(n.nodeType===3){const v=n.nodeValue,t=T(v);if(t!==v)n.nodeValue=t}else if(n.placeholder){const t=T(n.placeholder);if(t!==n.placeholder)n.placeholder=t}}}
if(TRE){new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)})}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',()=>trNode(document.body));}

      if(!user)return loginScreen();
      afterLogin();cloudPull();return;
    }catch(e){toast('Internet nahi — phone ka data dikha rahe hain');}
  }
  afterLogin();
}
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
